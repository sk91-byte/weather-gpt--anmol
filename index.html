    <meta name="theme-color" content="#1d4ed8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

  <body class="bg-slate-100 antialiased text-slate-800 selection:bg-blue-100 selection:text-blue-700">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Automatically purge any legacy Service Worker caches from previous builds
      if ('caches' in window) {
        caches.keys().then((names) => {
          names.forEach((name) => {
            if (name.includes('weathergpt-static-v1') || name.includes('weathergpt-static-v2') || name.includes('weathergpt-static-v3')) {
              caches.delete(name);
            }
          });
        });
      }

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            reg.update();
          }).catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
    </script>
  </body>
</html>
